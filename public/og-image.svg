<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0B1B32"/>
  
  <!-- Architectural grid & geometric accents -->
  <g stroke="#C5A46D" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>
  
  <!-- Background radial glow -->
  <circle cx="600" cy="300" r="400" fill="#102B50" fill-opacity="0.5"/>
  
  <!-- Center Monogram -->
  <g transform="translate(550, 110)">
    <rect x="0" y="0" width="100" height="100" rx="16" stroke="#C5A46D" stroke-width="2.5" fill="#102B50"/>
    <rect x="8" y="8" width="84" height="84" rx="12" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M28 32H72L34 68H72" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 22V32M50 68V78" stroke="#C5A46D" stroke-width="3" stroke-linecap="round"/>
    <polygon points="50,46 55,50 50,54 45,50" fill="#C5A46D"/>
  </g>

  <!-- Typography -->
  <text x="600" y="270" font-family="'Cinzel', 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="8" fill="#FFFFFF" text-anchor="middle">
    ZENTARA REALTY
  </text>
  <text x="600" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#C5A46D" text-anchor="middle">
    RESIDENTIAL REAL ESTATE CONSULTANCY • GURUGRAM
  </text>
  
  <text x="600" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="300" fill="#FFFFFF" text-anchor="middle">
    "Discover What's Next in Residential Living."
  </text>
  
  <text x="600" y="430" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#A5B4C7" text-anchor="middle">
    Pre-Launch &amp; New Launch Residential Developments in Gurgaon, Haryana
  </text>
  
  <!-- Badges at bottom -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#102B50" stroke="#C5A46D" stroke-width="1"/>
    <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#C5A46D" text-anchor="middle">PRE-LAUNCH ACCESS</text>
    
    <rect x="210" y="0" width="180" height="36" rx="18" fill="#102B50" stroke="#C5A46D" stroke-width="1"/>
    <text x="300" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#C5A46D" text-anchor="middle">NEW LAUNCHES</text>
    
    <rect x="420" y="0" width="180" height="36" rx="18" fill="#102B50" stroke="#C5A46D" stroke-width="1"/>
    <text x="510" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#C5A46D" text-anchor="middle">GURUGRAM CORE</text>
  </g>
</svg>
